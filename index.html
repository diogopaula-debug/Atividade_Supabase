<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos da Loja</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <script src="{{url_for('static', filename='app.js')}}" defer></script>
</head>
<body>
    <header class="topo">
        <div class="container">
            <h1>LOja Escola</h1>
            <p class="etiqueta">Aula de Regras de Nocio, Programação Backend</p>
        </div>
    </header>
    <main class="container">
        <section class="painel" aria-labelledby="titulo-cadastro">
            <p class="etiqueta">01 Cadsatrar</p>
            <h2 id="titulo-cadastro">Novo Produto</h2>
            <p>Preencha os dados.</p>

            <form id="formulario" novalidate>
                <label for="none">Nome do Produto</label>
                <input type="text"
                name="none"
                minlength="3"
                maxlength="80"
                placeholder="Ex... Cadastro universitario"
                required
                />

                <label for="categoria">Categoria</label>
                <select name="categoria_id" id="categoria">
                    <option value="">Slecione uma categoria</option>
                </select>
                <div class="campos-numericos">
                    <label for="preco">Preco (R$)</label>
                    <input type="number"
                    id="preco"
                    name="preco"
                    min="0.01"
                    max="9999999999.99"
                    step="0.01"
                    placeholder="25,90"
                    required
                    />
                </div>
                <div>
                    <label for="estoque">Estoque (unidade)</label>
                    <input type="number"
                    id="preco"
                    name="preco"
                    min="0"
                    max="10000000"
                    step="1"
                    placeholder="10"
                    required
                    />
                </div>
               <button id="botao-cadastrar" type="submit">Cadastrar Produto</button>
            </form>
            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        </section>
        
        <section class="painel" aria-labelledby="titulo-produtos">
            <div class="cabecalho-lista">
                <div>
                    <p class="etiqueta">02 Consultar</p>
                    <h2 id="titulo-produtos">Produtos cadastrados</h2>
                </div>
                <button id="botao-atualizar" type="button" class="segundario">
                    Atualizar lista
                </button>
            </div>
            <div>
                <p id="mensagem-lista" role="status" aria-live="polite"></p>
            </div>
            <div class="table-rolagem">
                <table>
                    <caption>
                        Catálogo da loja
                    </caption>
                    <thead>
                        <tr>
                            <th scope="col">Produto</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Preço</th>
                            <th scope="col">Estoque</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos">
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <footer class="container">
      Loja Escola · Laboratório de desenvolvimento de sistemas
    </footer>
</body>
</html>
